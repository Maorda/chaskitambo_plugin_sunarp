[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chaskitambo-plugin-sunarp"
version = "0.1.0"
description = "Plugin raspador de SUNARP para Chaskitambo con automatización basada en nodriver y gestión de sesiones."
requires-python = ">=3.10"
dependencies = [
    "chaskitambo>=0.1.0",
    "nodriver>=0.33",
    "loguru>=0.7.0",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaskitambo_plugin_sunarp"]

# 🎯 CRUCIAL: Asegura que los archivos de datos (JSON de oficinas y partidas) 
# se incluyan dentro de la distribución del paquete instalado.
[tool.hatch.build.targets.wheel.options]
artifacts = [
    "src/chaskitambo_plugin_sunarp/credenciales.json",
    "src/chaskitambo_plugin_sunarp/sunarp_local.json",
    
]

# Punto de entrada para que Chaskitambo descubra el scraper de Sunarp de forma agnóstica
[project.entry-points."chaskitambo.plugins"]
sunarp = "chaskitambo_plugin_sunarp.scraper:SunarpScraper"